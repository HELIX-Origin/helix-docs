# ==============================================================================
# jekyll-theme-helix - Theme Preview & Demonstration Configuration
# ==============================================================================

title: HELIX Docs
tagline: Modern Multi-Layout Theme for GitHub Pages
description: "A developer-first, multi-layout Jekyll theme engineered for developer documentation, technical knowledge base wikis, and project portals."
url: "https://www.helix-origin.club"
baseurl: "/helix-docs"
# This preview builds directly from the theme sources; it is not a theme-gem
# site. `theme: null` stops the github-pages gem from falling back to its
# default `jekyll-theme-primer`, which would otherwise leak its CSS into
# `_site/assets/css/style.css`.
theme: null
repository: "HELIX-Origin/helix-docs"
github_username: "HELIX-Origin"

# Site branding — HELIX Docs squircle artwork (assets/images/).
# `logo` is the header/sidebar brand mark, `favicon` the browser tab icon
# (multi-size .ico), and `icon` the Apple touch icon / PWA PNG.
logo: "assets/images/logo.svg"
favicon: "assets/images/favicon.ico"
icon: "assets/images/icon.png"

author:
  name: "HELIX Origin"
  url: "https://www.helix-origin.club"

encoding: "utf-8"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  parse_block_html: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: yaml
    guess_lang: true
    line_numbers: false
    wrap: true

# Sass / SCSS Configuration
sass:
  sass_dir: _sass
  style: compressed

# Mermaid (just-the-docs style)
mermaid:
  version: "11.12.0"

# Sidebar category icons (optional)
# Level-1 "category" pages show an emoji marker in the sidebar tree. Set the
# icon per page via `nav_icon:` front matter, or centrally with this map.
# Map keys may be a page title, its source path, or its output URL.
# nav_icons:
#   "Theme Documentation Directory": "📖"
#   "Community Wiki & Technical Architecture": "📚"

# Jekyll Collections Registration
collections:
  docs:
    output: true
    permalink: /docs/:path/
  wiki:
    output: true
    permalink: /wiki/:path/
  catalogue:
    output: true
    permalink: /catalogue/:path/
  store:
    output: true
    permalink: /store/:path/

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      comments: false
      nav_order: 9999

  - scope:
      path: "index.md"
    values:
      layout: default
      page_class: page--home

  # Type scopes use Jekyll's documented canonical form (`path: ""` + `type:`).
  # An empty `path` matches every item, so `{path: "", type: docs}` is
  # equivalent to `{type: docs}` — the `path` key is only present to satisfy
  # YAML schema linters that require it (they flag type-only scopes otherwise).
  - scope:
      path: ""
      type: docs
    values:
      layout: wiki
      page_class: page--doc
      section: docs

  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki
      page_class: page--wiki
      section: wiki

  - scope:
      path: ""
      type: catalogue
    values:
      layout: catalogue-item
      page_class: page--catalogue-item
      section: catalogue

  - scope:
      path: ""
      type: store
    values:
      layout: store-item
      page_class: page--store-item
      section: store
