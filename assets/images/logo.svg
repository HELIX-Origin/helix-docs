<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title description">
  <title id="title">HELIX Docs</title>
  <desc id="description">HELIX Docs squircle logo: a documentation window with a cyan-to-purple double-helix emblem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12243a"/>
      <stop offset="1" stop-color="#0a1727"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48d8f2"/>
      <stop offset="1" stop-color="#b06cff"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <!-- Squircle base -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <!-- Ambient accent glows -->
    <circle cx="198" cy="60" r="88" fill="#48d8f2" opacity=".16"/>
    <circle cx="58" cy="204" r="78" fill="#b06cff" opacity=".14"/>

    <!-- Documentation window -->
    <rect x="54" y="54" width="140" height="140" rx="16" fill="#0d1b2d" stroke="#48d8f2" stroke-opacity=".5" stroke-width="2.5"/>
    <!-- Title bar -->
    <path d="M54 70a16 16 0 0 1 16-16h108a16 16 0 0 1 16 16v14H54z" fill="#19324b" opacity=".92"/>
    <circle cx="70" cy="69" r="4" fill="#ff7188"/>
    <circle cx="86" cy="69" r="4" fill="#ffd27a"/>
    <circle cx="102" cy="69" r="4" fill="#67ddb0"/>
    <!-- Sidebar tree -->
    <rect x="54" y="84" width="44" height="110" fill="#0e1f35" opacity=".75"/>
    <line x1="98" y1="84" x2="98" y2="194" stroke="#203750" stroke-width="1.5"/>
    <rect x="62" y="94" width="28" height="6" rx="3" fill="#b06cff" opacity=".9"/>
    <rect x="60" y="108" width="34" height="13" rx="5" fill="#48d8f2" fill-opacity=".22" stroke="#48d8f2" stroke-opacity=".7" stroke-width="1.2"/>
    <circle cx="67" cy="136" r="2.2" fill="#a6b8ce" opacity=".7"/>
    <rect x="74" y="133" width="20" height="6" rx="3" fill="#a6b8ce" opacity=".5"/>
    <circle cx="67" cy="150" r="2.2" fill="#a6b8ce" opacity=".7"/>
    <rect x="74" y="147" width="16" height="6" rx="3" fill="#a6b8ce" opacity=".4"/>
    <!-- Content -->
    <rect x="108" y="94" width="74" height="9" rx="4" fill="#edf5ff"/>
    <rect x="108" y="110" width="72" height="6" rx="3" fill="#a6b8ce" opacity=".55"/>
    <rect x="108" y="122" width="54" height="6" rx="3" fill="#a6b8ce" opacity=".4"/>
    <!-- Code snippet card -->
    <rect x="108" y="138" width="74" height="48" rx="8" fill="#07111f" stroke="#203750" stroke-width="1.4"/>
    <rect x="116" y="148" width="28" height="5" rx="2.5" fill="#b06cff" opacity=".9"/>
    <rect x="148" y="148" width="24" height="5" rx="2.5" fill="#48d8f2" opacity=".85"/>
    <rect x="116" y="160" width="46" height="5" rx="2.5" fill="#67ddb0" opacity=".8"/>
    <rect x="116" y="172" width="34" height="5" rx="2.5" fill="#ffd27a" opacity=".8"/>

    <!-- Double-helix badge -->
    <circle cx="186" cy="186" r="27" fill="#0b1830" stroke="url(#edge)" stroke-width="3"/>
    <path d="M168 186c12-9 24 9 36 0m-36 0c12 9 24-9 36 0" fill="none" stroke="#48d8f2" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <circle cx="168" cy="186" r="3.5" fill="#b06cff"/>
    <circle cx="204" cy="186" r="3.5" fill="#48d8f2"/>
  </g>

  <!-- Accent border -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#edge)" stroke-width="4"/>
</svg>
