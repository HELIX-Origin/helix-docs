<div class="translate-control notranslate" translate="no">
  <label for="translate-select">🌐 <span class="visually-hidden">Language</span></label>
  <select id="translate-select" aria-label="Translate this page" disabled>
    {%- if site.data.languages and site.data.languages.size > 0 -%}
      {%- for language in site.data.languages -%}
      <option value="{{ language.code }}" lang="{{ language.code }}">{{ language.name }}</option>
      {%- endfor -%}
    {%- else -%}
      {%- comment -%} Hard-coded fallback — must mirror `_data/languages.yml` (18 languages) {%- endcomment -%}
      {%- assign fallback_codes = "en,ja,zh-CN,zh-TW,ko,es,fr,de,ru,pt,it,th,vi,id,pl,nl,tr,ar" | split: "," -%}
      {%- assign fallback_names = "English,日本語,简体中文,繁體中文,한국어,Español,Français,Deutsch,Русский,Português,Italiano,ไทย,Tiếng Việt,Bahasa Indonesia,Polski,Nederlands,Türkçe,العربية" | split: "," -%}
      {%- for code in fallback_codes -%}
      <option value="{{ code }}" lang="{{ code }}">{{ fallback_names[forloop.index0] }}</option>
      {%- endfor -%}
    {%- endif -%}
  </select>
</div>
