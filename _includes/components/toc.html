{%- comment -%}
  components/toc.html — In-page table of contents (built client-side from
  the h2/h3 headings inside .docs-content), self-contained with its script.
{%- endcomment -%}
<nav class="in-page-toc" id="in-page-toc" aria-label="Table of contents">
  <div class="in-page-toc-header">
    <span class="in-page-toc-icon" aria-hidden="true">📑</span>
    <span class="in-page-toc-title">Table of Contents</span>
  </div>
  <ul class="in-page-toc-list" id="in-page-toc-list"></ul>
</nav>
<script>
  (function() {
    const content = document.querySelector('.docs-content');
    const tocList = document.getElementById('in-page-toc-list');
    const tocContainer = document.getElementById('in-page-toc');
    if (!content || !tocList || !tocContainer) return;

    const headings = content.querySelectorAll('h2, h3');
    if (headings.length === 0) {
      tocContainer.style.display = 'none';
      return;
    }

    headings.forEach(function(h, index) {
      if (!h.id) {
        h.id = 'section-' + (index + 1);
      }
      const li = document.createElement('li');
      li.className = 'in-page-toc-item in-page-toc-item--' + h.tagName.toLowerCase();
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/^[#\s]+/, '').trim();
      li.appendChild(a);
      tocList.appendChild(li);
    });
  })();
</script>
